services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: skyking, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}", POSTGRES_DB: skyking }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U skyking"], interval: 5s, retries: 10 }
  api:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgresql://skyking:${DB_PASSWORD}@db:5432/skyking" }
    depends_on: { db: { condition: service_healthy } }
    ports: [ "8000:8000" ]
    volumes: [ "uploads:/srv/uploads" ]
  worker:                       # SLA scanner, MSG91/email intake, outbound messages
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgresql://skyking:${DB_PASSWORD}@db:5432/skyking" }
    command: python -m app.worker
    depends_on: [ api ]
    volumes: [ "uploads:/srv/uploads" ]
volumes: { pgdata: {}, uploads: {} }
